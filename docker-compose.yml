services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bms
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
